<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://firestore.googleapis.com; style-src 'self' 'unsafe-inline';">
    <title>Stundenzettel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #006060 0%, #096969 100%); min-height: 100vh; padding: 10px; display: flex; justify-content: center; align-items: flex-start; }
        .container { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); padding: 15px; max-width: 650px; width: 100%; margin: 10px 0; }
        h1 { text-align: center; font-size: 1.4rem; color: #333; margin-bottom: 15px; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        select { flex: 1; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.95rem; background: #f9f9f9; }
        .back-btn { padding: 10px 15px; background: #667eea; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.9rem; white-space: nowrap; }
        
        .table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid #e0e0e0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 550px; }
        th { background: #f1f5f9; color: #475569; font-weight: 600; text-align: left; padding: 8px 6px; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid #cbd5e1; white-space: nowrap; }
        td { padding: 6px; border-bottom: 1px solid #f1f5f9; color: #334155; font-family: ui-monospace, monospace; }
        tr:last-child td { border-bottom: none; }
        .total-cell { font-weight: 700; color: #059669; text-align: right; padding-right: 10px; }
        .duration-cell { text-align: right; color: #64748b; }
        .empty-day { color: #94a3b8; font-style: italic; text-align: center; padding: 20px; }
        
        .edit-btn { background: #fbbf24; color: #1f2937; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: 600; }
        .edit-btn:hover { background: #f59e0b; }
        
        .loading { text-align: center; padding: 20px; color: #64748b; }
        .error { text-align: center; padding: 15px; background: #fef2f2; color: #dc2626; border-radius: 8px; margin-top: 10px; display: none; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 12px; padding: 20px; max-width: 380px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .modal-header { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; color: #333; }
        .modal-field { margin-bottom: 12px; }
        .modal-field label { display: block; font-size: 0.85rem; color: #64748b; margin-bottom: 4px; font-weight: 600; }
        .modal-field input { width: 100%; padding: 8px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 0.95rem; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        .modal-btn.save { background: #667eea; color: white; }
        .modal-btn.cancel { background: #e0e0e0; color: #333; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>📅 Stundenzettel (Laufender Monat)</h1>
    
    <div class="controls">
      <select id="employeeSelect"><option value="">Mitarbeiter wählen...</option></select>
      <a href="index.html" class="back-btn">← Zurück</a>
    </div>

    <div id="errorMsg" class="error"></div>
    <div id="tableContainer" class="table-wrapper">
      <div class="loading">Bitte Mitarbeiter auswählen...</div>
    </div>
  </div>

  <!-- Dynamisches Modal mit Passwortabfrage -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header" id="modalTitle">Zeiten bearbeiten</div>
      
      <div id="dayEditFields" style="display:none;">
        <div class="modal-field">
          <label>Kommen (In)</label>
          <input type="time" id="editIn">
        </div>
        <div class="modal-field">
          <label>Pause Start</label>
          <input type="time" id="editPauseIn">
        </div>
        <div class="modal-field">
          <label>Pause Ende</label>
          <input type="time" id="editPauseOut">
        </div>
        <div class="modal-field">
          <label>Gehen (Out)</label>
          <input type="time" id="editOut">
        </div>
      </div>

      <div id="rowEditFields" style="display:none;">
        <div class="modal-field">
          <label>Beginn (dieser Block)</label>
          <input type="time" id="editRowIn">
        </div>
        <div class="modal-field">
          <label>Ende (dieser Block)</label>
          <input type="time" id="editRowOut">
        </div>
      </div>

      <!-- NEU: Passwortfeld -->
      <div class="modal-field" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
        <label style="color: #dc2626;">🔒 Passwort zur Bestätigung</label>
        <input type="password" id="editPassword" placeholder="••••••" style="border-color: #fca5a5;">
      </div>

      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeModal()">Abbrechen</button>
        <button class="modal-btn save" onclick="saveEdits()">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyDmJJV49Uik0ISYWDMEAoGfWTcgYeyjZs8", authDomain: "fengsigns-timetracker.firebaseapp.com", projectId: "fengsigns-timetracker", storageBucket: "fengsigns-timetracker.firebasestorage.app", messagingSenderId: "1035298719582", appId: "1:1035298719582:web:0fe57c5141a7539b82b1cf" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let staffDB = {};
    let currentEntries = [];
    let currentUser = null;
    const employeeSelect = document.getElementById('employeeSelect');
    const tableContainer = document.getElementById('tableContainer');
    const errorMsg = document.getElementById('errorMsg');

    async function loadStaff() {
      try {
        const res = await fetch('staff.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        staffDB = await res.json();
        const names = Object.keys(staffDB);
        employeeSelect.innerHTML = '<option value="">-- Bitte wählen --</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
        
        const savedUser = localStorage.getItem('tz_user');
        if (savedUser && names.includes(savedUser)) {
          employeeSelect.value = savedUser;
          loadTimesheet(savedUser);
        }
      } catch (e) {
        showError('Mitarbeiter-Daten nicht ladbar.');
      }
    }

    function toDateSafe(val) {
      if (!val) return null;
      if (val.toDate) return val.toDate();
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : d;
    }

    function fmtDateShort(isoString) {
      const d = new Date(isoString);
      return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    }

    function fmtTime(val) {
      const d = toDateSafe(val);
      return d ? d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '-';
    }

    function fmtDur(mins) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h > 0 ? `${h}h ${m}m` : `${m}min`;
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      tableContainer.innerHTML = '';
    }

    async function loadTimesheet(user) {
      if (!user) {
        tableContainer.innerHTML = '<div class="loading">Bitte Mitarbeiter auswählen...</div>';
        return;
      }
      currentUser = user;
      localStorage.setItem('tz_user', user);
      tableContainer.innerHTML = '<div class="loading">Lade Daten...</div>';
      errorMsg.style.display = 'none';

      try {
        const now = new Date();
        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);

        const snap = await db.collection('entries')
          .where('employee', '==', user)
          .where('startTime', '>=', monthStart)
          .where('startTime', '<=', monthEnd)
          .orderBy('startTime', 'asc')
          .get();

        if (snap.empty) {
          tableContainer.innerHTML = '<div class="empty-day">Keine Einträge in diesem Monat.</div>';
          return;
        }

        currentEntries = [];
        const byDay = {};
        let hasComplexDays = false;

        snap.forEach(doc => {
          const data = doc.data();
          const start = toDateSafe(data.startTime);
          if (!start) return;
          const dateKey = start.toISOString().slice(0, 10);
          
          const entry = {
            id: doc.id,
            employee: data.employee,
            startTime: data.startTime,
            endTime: data.endTime,
            startMs: start.getTime(),
            endMs: data.endTime ? toDateSafe(data.endTime).getTime() : start.getTime()
          };
          
          currentEntries.push(entry);
          if (!byDay[dateKey]) byDay[dateKey] = [];
          byDay[dateKey].push(entry);
        });

        for (const key in byDay) {
          if (byDay[key].length >= 3) {
            hasComplexDays = true;
            break;
          }
        }

        let headerHtml = '';
        if (hasComplexDays) {
          headerHtml = `<tr>
            <th style="width:12%">Tag</th>
            <th style="width:15%">Von</th>
            <th style="width:15%">Bis</th>
            <th style="width:15%">Dauer</th>
            <th style="width:15%; text-align:right;">Gesamt</th>
            <th style="width:28%; text-align:center;">Aktion</th>
          </tr>`;
        } else {
          headerHtml = `<tr>
            <th style="width:12%">Tag</th>
            <th style="width:15%">In</th>
            <th style="width:15%">Pause In</th>
            <th style="width:15%">Pause Out</th>
            <th style="width:15%">Out</th>
            <th style="width:15%; text-align:right;">Stunden</th>
            <th style="width:13%; text-align:center;">Aktion</th>
          </tr>`;
        }

        let html = `<table><thead>${headerHtml}</thead><tbody>`;
        const sortedDays = Object.keys(byDay).sort();

        for (const dateKey of sortedDays) {
          const entries = byDay[dateKey].sort((a, b) => a.startMs - b.startMs);
          const totalMin = entries.reduce((sum, e) => sum + (e.endTime ? (e.endMs - e.startMs) / 60000 : 0), 0);

          if (hasComplexDays) {
            if (entries.length <= 2) {
              const d1 = entries[0];
              const d2 = entries[1] || null;
              
              const inTime = fmtTime(d1.startTime);
              const outTime = d2 ? fmtTime(d2.endTime) : fmtTime(d1.endTime);
              
              html += `<tr>
                <td style="font-family: inherit; font-weight: 600">${fmtDateShort(dateKey)}</td>
                <td>${inTime}</td>
                <td>${outTime}</td>
                <td class="duration-cell">${fmtDur(Math.floor(totalMin))}</td>
                <td class="total-cell">${fmtDur(Math.floor(totalMin))}</td>
                <td style="text-align: center;"><button class="edit-btn" onclick="openEditDay('${dateKey}')">✏️</button></td>
              </tr>`;
            } else {
              entries.forEach((entry, index) => {
                const isLast = index === entries.length - 1;
                const tag = index === 0 ? fmtDateShort(dateKey) : '';
                const blockMin = entry.endTime ? Math.floor((entry.endMs - entry.startMs) / 60000) : 0;
                const totalDur = isLast ? fmtDur(Math.floor(totalMin)) : '';
                
                html += `<tr>
                  <td style="font-family: inherit; font-weight: ${index === 0 ? '600' : 'normal'}">${tag}</td>
                  <td>${fmtTime(entry.startTime)}</td>
                  <td>${fmtTime(entry.endTime)}</td>
                  <td class="duration-cell">${fmtDur(blockMin)}</td>
                  <td class="total-cell">${totalDur}</td>
                  <td style="text-align: center;"><button class="edit-btn" onclick="openEditRow('${entry.id}')">✏️</button></td>
                </tr>`;
              });
            }
          } else {
            const d1 = entries[0];
            const d2 = entries[1] || null;
            
            const inTime = fmtTime(d1.startTime);
            const pauseIn = d2 ? fmtTime(d1.endTime) : '-';
            const pauseOut = d2 ? fmtTime(d2.startTime) : '-';
            const outTime = d2 ? fmtTime(d2.endTime) : fmtTime(d1.endTime);
            
            html += `<tr>
              <td style="font-family: inherit; font-weight: 600">${fmtDateShort(dateKey)}</td>
              <td>${inTime}</td>
              <td>${pauseIn}</td>
              <td>${pauseOut}</td>
              <td>${outTime}</td>
              <td class="total-cell">${fmtDur(Math.floor(totalMin))}</td>
              <td style="text-align: center;"><button class="edit-btn" onclick="openEditDay('${dateKey}')">✏️</button></td>
            </tr>`;
          }
        }

        html += '</tbody></table>';
        tableContainer.innerHTML = html;

      } catch (e) {
        console.error(e);
        showError('Fehler beim Laden: ' + e.message);
      }
    }

    let editMode = '';
    let currentEditDateKey = null;
    let currentEditEntryId = null;

    function openEditDay(dateKey) {
      currentEditDateKey = dateKey;
      const dayEntries = currentEntries.filter(e => toDateSafe(e.startTime).toISOString().slice(0, 10) === dateKey).sort((a, b) => a.startMs - b.startMs);
      
      document.getElementById('dayEditFields').style.display = 'block';
      document.getElementById('rowEditFields').style.display = 'none';
      document.getElementById('editPassword').value = ''; // Passwort zurücksetzen

      if (dayEntries.length === 1) {
        editMode = 'day-1';
        document.getElementById('modalTitle').textContent = 'Eintrag bearbeiten (Pause nachtragen möglich)';
        document.getElementById('editIn').value = fmtTime(dayEntries[0].startTime);
        document.getElementById('editPauseIn').value = '';
        document.getElementById('editPauseOut').value = '';
        document.getElementById('editOut').value = fmtTime(dayEntries[0].endTime);
      } else {
        editMode = 'day-2';
        document.getElementById('modalTitle').textContent = 'Tageszeiten bearbeiten (2 Blöcke)';
        document.getElementById('editIn').value = fmtTime(dayEntries[0].startTime);
        document.getElementById('editPauseIn').value = fmtTime(dayEntries[0].endTime);
        document.getElementById('editPauseOut').value = fmtTime(dayEntries[1].startTime);
        document.getElementById('editOut').value = fmtTime(dayEntries[1].endTime);
      }
      document.getElementById('editModal').classList.add('active');
    }

    function openEditRow(entryId) {
      editMode = 'row';
      currentEditEntryId = entryId;
      const entry = currentEntries.find(e => e.id === entryId);
      if (!entry) return;

      document.getElementById('dayEditFields').style.display = 'none';
      document.getElementById('rowEditFields').style.display = 'block';
      document.getElementById('editPassword').value = ''; // Passwort zurücksetzen
      document.getElementById('modalTitle').textContent = 'Diesen Zeitblock bearbeiten';
      
      document.getElementById('editRowIn').value = fmtTime(entry.startTime);
      document.getElementById('editRowOut').value = entry.endTime ? fmtTime(entry.endTime) : '';
      
      document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
      document.getElementById('editPassword').value = ''; // Passwort beim Schließen löschen
      editMode = '';
      currentEditDateKey = null;
      currentEditEntryId = null;
    }

    async function saveEdits() {
      // 1. PASSWORT-PRÜFUNG
      const enteredPw = document.getElementById('editPassword').value;
      if (!currentUser || !staffDB[currentUser] || staffDB[currentUser] !== enteredPw) {
        alert('❌ Falsches Passwort. Änderungen wurden nicht gespeichert.');
        document.getElementById('editPassword').value = '';
        return; // Abbruch der Funktion
      }

      try {
        // 2. SPEICHER-LOGIK (nur erreichbar bei korrektem Passwort)
        if (editMode === 'day-1') {
          const dayEntries = currentEntries.filter(e => toDateSafe(e.startTime).toISOString().slice(0, 10) === currentEditDateKey);
          const inTime = document.getElementById('editIn').value;
          const pauseInTime = document.getElementById('editPauseIn').value;
          const pauseOutTime = document.getElementById('editPauseOut').value;
          const outTime = document.getElementById('editOut').value;
          
          if (pauseInTime && pauseOutTime) {
            await updateEntry(dayEntries[0].id, inTime, pauseInTime);
            
            const baseDate = toDateSafe(dayEntries[0].startTime);
            const newStart = new Date(baseDate);
            const [h1, m1] = pauseOutTime.split(':');
            newStart.setHours(parseInt(h1), parseInt(m1), 0, 0);
            
            const newEnd = new Date(baseDate);
            const [h2, m2] = outTime.split(':');
            newEnd.setHours(parseInt(h2), parseInt(m2), 0, 0);
            
            await db.collection('entries').add({
              employee: currentUser,
              startTime: firebase.firestore.Timestamp.fromDate(newStart),
              endTime: firebase.firestore.Timestamp.fromDate(newEnd),
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          } else {
            await updateEntry(dayEntries[0].id, inTime, outTime);
          }
        } 
        else if (editMode === 'day-2') {
          const dayEntries = currentEntries.filter(e => toDateSafe(e.startTime).toISOString().slice(0, 10) === currentEditDateKey).sort((a, b) => a.startMs - b.startMs);
          const inTime = document.getElementById('editIn').value;
          const pInTime = document.getElementById('editPauseIn').value;
          const pOutTime = document.getElementById('editPauseOut').value;
          const outTime = document.getElementById('editOut').value;
          
          await updateEntry(dayEntries[0].id, inTime, pInTime);
          await updateEntry(dayEntries[1].id, pOutTime, outTime);
        } 
        else if (editMode === 'row') {
          const inTime = document.getElementById('editRowIn').value;
          const outTime = document.getElementById('editRowOut').value;
          await updateEntry(currentEditEntryId, inTime, outTime);
        }
        
        closeModal();
        loadTimesheet(employeeSelect.value);
      } catch (e) {
        console.error(e);
        alert('Fehler beim Speichern: ' + e.message);
      }
    }

    async function updateEntry(id, inStr, outStr) {
      const entry = currentEntries.find(e => e.id === id);
      if (!entry) return;
      
      const baseDate = toDateSafe(entry.startTime);
      const updateData = {};

      const newStart = new Date(baseDate);
      const [h1, m1] = inStr.split(':');
      newStart.setHours(parseInt(h1), parseInt(m1), 0, 0);
      updateData.startTime = firebase.firestore.Timestamp.fromDate(newStart);

      if (outStr) {
        const newEnd = new Date(baseDate);
        const [h2, m2] = outStr.split(':');
        newEnd.setHours(parseInt(h2), parseInt(m2), 0, 0);
        updateData.endTime = firebase.firestore.Timestamp.fromDate(newEnd);
      }

      await db.collection('entries').doc(id).update(updateData);
    }

    employeeSelect.addEventListener('change', (e) => loadTimesheet(e.target.value));
    loadStaff();
  </script>
</body>
</html>
