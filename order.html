<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://firestore.googleapis.com; style-src 'self' 'unsafe-inline';">

    <title>Lager Bestellung</title>
    
    <!-- jsPDF und html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        .order-card.vorbereitet { 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s; 
        }
        .order-card.vorbereitet:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3); 
        }
        .order-card.vorbereitet:active { 
            transform: scale(0.98); 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #006060 0%, #096969 100%); min-height: 100vh; padding: 10px; overflow-x: hidden; width: 100%; display: flex; justify-content: center; align-items: flex-start; }
        .container { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); padding: 20px; max-width: 600px; width: 100%; margin: 10px 0; }
        h1, h2 { color: #333; margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 20px; font-size: 13px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #444; font-weight: 600; font-size: 13px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: all 0.3s ease; background: #f9f9f9; }
        input:focus, select:focus { outline: none; border-color: #667eea; background: white; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
        .autocomplete-container { position: relative; }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 2px solid #667eea; border-top: none; border-radius: 0 0 10px 10px; max-height: 200px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); display: none; }
        .autocomplete-list.active { display: block; }
        .autocomplete-list::-webkit-scrollbar { width: 12px; }
        .autocomplete-list::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 6px; }
        .autocomplete-list::-webkit-scrollbar-thumb { background: #667eea; border-radius: 6px; border: 3px solid #f1f1f1; }
        .order-product, .product-name, .article-number, .autocomplete-item .product-name { overflow-wrap: break-word; word-break: break-word; }
        .autocomplete-list::-webkit-scrollbar-thumb:hover { background: #2abbbb; }
        .autocomplete-item { padding: 12px 15px; cursor: pointer; transition: background 0.2s ease; border-bottom: 1px solid #f0f0f0; }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { background: #e8ebf9; }
        .autocomplete-item .article-number { font-weight: 600; color: #667eea; }
        .autocomplete-item .product-name { overflow-wrap: break-word; word-wrap: break-word; word-break: break-word; hyphens: auto; color: #666; font-size: 14px; }
        button[type="submit"] { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; margin-top: 5px; }
        button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        button[type="submit"]:active { transform: translateY(0); }
        button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .success-message { display: none; background: #4caf50; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-weight: 600; }
        @media (max-width: 600px) { .container { position: relative; padding: 25px; } h1 {font-size: 24px;} .row {grid-template-columns: 1fr;} }
        .orders-section { margin-top: 40px; padding-top: 30px; border-top: 2px solid #e0e0e0; }
        .orders-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .orders-header h2 { color: #333; font-size: 22px; }
        .filter-buttons { display: flex; gap: 8px; }
        .filter-btn { padding: 6px 12px; border: 2px solid #667eea; background: white; color: #667eea; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.3s ease; }
        .filter-btn.active { background: #667eea; color: white; }
        .orders-list { display: flex; flex-direction: column; gap: 15px; max-height: 400px; overflow-y: auto; }
        .order-card { background: #f9f9f9; border-radius: 10px; padding: 15px; border-left: 4px solid #FF9800; }
        .order-card.vorbereitet { border-left-color: #2196F3; }
        .order-header { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
        .order-product { flex: 1; text-align: left; font-weight: bold; overflow-wrap: break-word; word-wrap: break-word; word-break: break-word; hyphens: auto; color: #333; }
        .order-quantity { font-weight: bold; color: #555; white-space: nowrap; margin-right: 8px; }
        .order-status { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: #FF9800; color: white; white-space: nowrap; }
        .order-status.vorbereitet { background: #2196F3; }
        .order-details { font-size: 14px; color: #666; line-height: 1.6; }
        .no-orders { text-align: center; padding: 30px; color: #999; }
    </style>
</head>
<body>
  <div class="container">
    <h1>📦 Lager Bestellung</h1>
    <p class="subtitle">Artikel aktualisiert: 25.05.26</p>
    <div id="successMessage" class="success-message">✓ Bestellung erfolgreich übermittelt!</div>
    <div id="errorMessage" style="display: none; background: #f44336; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-weight: 600;"></div>
    <form id="orderForm">
      <div class="form-group"><label for="articleNumber">Artikelnummer *</label><div class="autocomplete-container"><input type="text" id="articleNumber" name="articleNumber" required placeholder="z.B. 1712" autocomplete="off"><div id="articleAutocomplete" class="autocomplete-list"></div></div></div>
      <div class="form-group"><label for="productName">Produktname *</label><div class="autocomplete-container"><input type="text" id="productName" name="productName" required placeholder="z.B. Armband" autocomplete="off"><div id="productAutocomplete" class="autocomplete-list"></div></div></div>
      <div class="form-group"><div class="row"><div><label for="quantity">Menge *</label><input type="number" id="quantity" name="quantity" required min="0" step="0.5" placeholder="z.B. 12"></div><div><label for="unit">Einheit *</label><select id="unit" name="unit" required><option value="">Wählen...</option><option value="Karton">Karton</option><option value="Stück">Stück</option><option value="kg">kg</option></select></div></div></div>
     <button type="submit">Bestellung absenden</button>
    </form>
    <div class="orders-section">
      <div class="orders-header"><h2>Aktuelle Bestellungen</h2><div class="filter-buttons"><button class="filter-btn active" data-filter="all">Alle</button><button class="filter-btn" data-filter="offen">Offen</button><button class="filter-btn" data-filter="vorbereitet">Vorbereitet</button></div></div>
      <div id="ordersList" class="orders-list"><div class="no-orders">Lade Bestellungen...</div></div>
    </div>
    
    <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-start;">
        <button id="toggleUsedBtn" style="padding: 8px 12px; font-size: 18px; border-radius: 50%; background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.2); cursor: pointer; border: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;" title="Fehlende Artikel anzeigen">🚫</button>
        <a id="toTimeTrackerBtn" href="index.html" title="Zurück zur Zeiterfassung" style="display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;font-size:18px;border-radius:50%;background:white;box-shadow:0 2px 6px rgba(0,0,0,0.2);cursor:pointer;border:none;text-decoration:none;color:#333;width:44px;height:44px;">⏱️</a>
        <button id="cleanupBtn" style="padding: 8px 12px; font-size: 18px; border-radius: 50%; background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.2); cursor: pointer; border: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;" title="Erledigte Bestellungen löschen">🗑️</button>
    </div>

    <!-- Filterzeile für fehlende Artikel (initial ausgeblendet) -->
    <div id="usedItemsFilterContainer" style="display: none; margin-top: 15px; padding: 10px; background: #f0f4f8; border-radius: 8px; flex-wrap: wrap; gap: 10px; align-items: center;">
        <label for="supplierFilter" style="font-size: 13px; font-weight: 600; color: #444;">Nach Lieferant filtern:</label>
        <select id="supplierFilter" style="flex: 1; min-width: 150px; padding: 6px 10px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; background: white; cursor: pointer;">
            <option value="all">Alle Lieferanten</option>
        </select>
        <button id="exportPdfBtn" style="padding: 6px 12px; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: background 0.2s;">
            📄 PDF exportieren
        </button>
    </div>

    <div id="usedItemsList" class="orders-list" style="display: none; margin-top: 10px; max-height: 300px; overflow-y: auto;">
        <div class="no-orders">Lade fehlende Artikel...</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = { apiKey: "AIzaSyDmJJV49Uik0ISYWDMEAoGfWTcgYeyjZs8", authDomain: "fengsigns-timetracker.firebaseapp.com", projectId: "fengsigns-timetracker", storageBucket: "fengsigns-timetracker.firebasestorage.app", messagingSenderId: "1035298719582", appId: "1:1035298719582:web:0fe57c5141a7539b82b1cf" };
    firebase.initializeApp(firebaseConfig); 
    const db = firebase.firestore(); 
    let productsDB = [];

    async function loadProducts() { 
        try { 
            const response = await fetch('https://squallwolf.github.io/FengSigns-TimeTracker/products.json'); 
            if (!response.ok) throw new Error(`HTTP ${response.status}`); 
            productsDB = await response.json(); 
            console.log('✅ Produkte geladen:', productsDB.length); 
        } catch (err) { 
            console.error('❌ Fehler beim Laden von products.json:', err); 
            alert('Produktdaten konnten nicht geladen werden. Bitte prüfe products.json.'); 
        } 
    }

    document.addEventListener('DOMContentLoaded', () => { 
        loadProducts().then(() => { document.getElementById('articleNumber')?.focus(); }); 
    });

    function getSupplierByArticleNumber(articleNumber) {
        const product = productsDB.find(p => String(p.articleNumber).trim() === String(articleNumber).trim());
        return product && product.supplier ? product.supplier.trim() : 'Unbekannt';
    }

    const articleInput = document.getElementById('articleNumber');
    const productInput = document.getElementById('productName');
    const articleAutocomplete = document.getElementById('articleAutocomplete');
    const productAutocomplete = document.getElementById('productAutocomplete');

    function setupAutocomplete(inputElement, autocompleteElement, searchBy) {
        inputElement.addEventListener('input', function() { 
            const value = this.value.toLowerCase().trim(); 
            autocompleteElement.innerHTML = ''; 
            if (value.length === 0) { autocompleteElement.classList.remove('active'); return; } 
            const filtered = productsDB.filter(product => { 
                return searchBy === 'article' ? String(product.articleNumber).toLowerCase().includes(value) : product.productName.toLowerCase().includes(value); 
            }); 
            if (filtered.length > 0) { 
                filtered.forEach(product => { 
                    const div = document.createElement('div'); 
                    div.className = 'autocomplete-item'; 
                    div.innerHTML = `<div class="article-number">${product.articleNumber}</div><div class="product-name">${product.productName}</div>`; 
                    div.addEventListener('click', function() { 
                        articleInput.value = product.articleNumber; 
                        productInput.value = product.productName; 
                        articleAutocomplete.classList.remove('active'); 
                        productAutocomplete.classList.remove('active'); 
                    }); 
                    autocompleteElement.appendChild(div); 
                }); 
                autocompleteElement.classList.add('active'); 
            } else { 
                autocompleteElement.classList.remove('active'); 
            } 
        }); 
    }

    const cleanupBtn = document.getElementById('cleanupBtn');
    cleanupBtn.addEventListener('click', async () => {
        if (!confirm('Alle erledigten Bestellungen wirklich löschen?')) return;
        try {
            const snapshot = await db.collection('orders').where('status', '==', 'erledigt').get();
            if (snapshot.empty) {
                alert('Keine erledigten Bestellungen gefunden.');
                return;
            }
            const batch = db.batch();
            snapshot.forEach(doc => { batch.delete(doc.ref); });
            await batch.commit();
            alert(`${snapshot.size} erledigte Bestellungen gelöscht.`);
        } catch (error) {
            console.error('Fehler beim Löschen:', error);
            alert('Fehler: ' + error.message);
        }
    });

    setupAutocomplete(articleInput, articleAutocomplete, 'article');
    setupAutocomplete(productInput, productAutocomplete, 'product');

    const form = document.getElementById('orderForm');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        submitBtn.disabled = true;
        const originalBtnText = submitBtn.textContent;
        submitBtn.textContent = 'Bitte warten...';
        setTimeout(() => {
            submitBtn.disabled = false;
            submitBtn.textContent = originalBtnText;
        }, 1200);
        
        const articleNumber = document.getElementById('articleNumber').value.trim();
        const productName = document.getElementById('productName').value.trim();
        const quantity = parseFloat(document.getElementById('quantity').value);
        const unit = document.getElementById('unit').value;
        const errorMsg = document.getElementById('errorMessage');
        const isNumericArticle = /^\d+$/.test(articleNumber);

        if (isNumericArticle) {
            try {
                const missingCheck = await db.collection('orders').where('articleNumber', '==', articleNumber).where('status', '==', 'fehlend').get();
                if (!missingCheck.empty) {
                    errorMsg.textContent = `⚠️ "${productName}" (Art-Nr: ${articleNumber}) ist zur Zeit nicht verfügbar!`;
                    errorMsg.style.display = 'block';
                    setTimeout(() => { errorMsg.style.display = 'none'; }, 5000);
                    return;
                }
            } catch (error) {
                console.error('Fehler bei der Verfügbarkeitsprüfung:', error);
            }
        }

        const formData = {
            articleNumber: articleNumber,
            productName: productName,
            quantity: quantity,
            unit: unit,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status: 'offen'
        };

        try {
            const docRef = await db.collection('orders').add(formData);
            successMessage.textContent = '✓ Bestellung erfolgreich übermittelt! (ID: ' + docRef.id + ')';
            successMessage.style.display = 'block';
            errorMsg.style.display = 'none';
            
            document.getElementById('articleNumber').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('unit').value = '';
            document.getElementById('articleNumber').focus();
            
            setTimeout(() => { 
                successMessage.style.display = 'none'; 
                successMessage.textContent = '✓ Bestellung erfolgreich übermittelt!'; 
            }, 5000);
        } catch (error) {
            console.error('Firestore-Fehler:', error);
            alert('Fehler beim Übermitteln: ' + error.message);
        }
    });

    let currentFilter = 'all';

    function getRelativeDeliveryLabel(deliveryDate) { 
        if (!deliveryDate) return 'Unbekannt'; 
        const delivery = deliveryDate.toDate ? deliveryDate.toDate() : deliveryDate; 
        return delivery.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }); 
    }

    function loadOrders() { 
        db.collection('orders').onSnapshot((snapshot) => { 
            const ordersList = document.getElementById('ordersList'); 
            if (snapshot.empty) { 
                ordersList.innerHTML = '<div class="no-orders">Keine Bestellungen vorhanden</div>'; 
                return; 
            } 
            
            let orders = []; 
            snapshot.forEach((doc) => { 
                const order = { id: doc.id, ...doc.data() }; 
                if (order.status === 'aufgebraucht' || order.status === 'fehlend') return; 
                if (currentFilter === 'offen' && order.status !== 'offen') return; 
                if (currentFilter === 'vorbereitet' && order.status !== 'vorbereitet') return; 
                if (currentFilter === 'all' && order.status === 'erledigt') return;
                orders.push(order); 
            }); 
            
            orders.sort((a, b) => { 
                const aTs = a.timestamp?.seconds || a.timestamp?.toDate?.()?.getTime?.() || 0;
                const bTs = b.timestamp?.seconds || b.timestamp?.toDate?.()?.getTime?.() || 0;
                return bTs - aTs;
            });

            ordersList.innerHTML = ''; 
            if (orders.length === 0) { 
                ordersList.innerHTML = '<div class="no-orders">Keine Bestellungen in dieser Kategorie</div>'; 
                return; 
            }

            orders.forEach((order) => { 
                const card = document.createElement('div'); 
                card.className = `order-card ${order.status}`; 
                const statusText = order.status === 'offen' ? 'Offen' : 'Vorbereitet'; 
                
                card.innerHTML = `
                    <div class="order-header">
                        <div class="order-product">${order.productName}</div>
                        <div class="order-quantity">${order.quantity}&nbsp;${order.unit}</div>
                        <div class="order-status ${order.status}">${statusText}</div>
                    </div>
                    <div class="order-details">Art-Nr: ${order.articleNumber}</div>
                    <div class="comment-section" style="margin-top:8px;">
                        <button class="toggle-comment" data-id="${order.id}" style="font-size:12px; padding:4px 8px; background:#eee; border:1px solid #ccc; border-radius:4px; cursor:pointer;">💬 Notiz</button>
                        <div class="comment-editor" data-id="${order.id}" style="display:none; margin-top:6px;">
                            <textarea class="comment-input" data-id="${order.id}" style="width:100%; padding:6px; font-size:14px; border:1px solid #ccc; border-radius:4px;" rows="2">${order.comment || ''}</textarea>
                            <div style="margin-top:4px;">
                                <button class="save-comment" data-id="${order.id}" style="padding:4px 8px; background:#667eea; color:white; border:none; border-radius:4px; font-size:12px;">Sichern</button>
                                <button class="cancel-comment" data-id="${order.id}" style="padding:4px 8px; background:#ccc; border:none; border-radius:4px; font-size:12px; margin-left:6px;">Abbrechen</button>
                            </div>
                        </div>
                    </div>`; 
                
                if (order.status === 'vorbereitet') {
                    card.title = 'Klicken, um Erhalt zu bestätigen';
                    card.addEventListener('click', async (e) => {
                        if (e.target.closest('.comment-section') || e.target.closest('button')) return;
                        if (confirm(`"${order.productName}" (${order.quantity} ${order.unit}) als erhalten/erledigt markieren?`)) {
                            try {
                                card.style.opacity = '0.5';
                                await db.collection('orders').doc(order.id).update({ status: 'erledigt' });
                                card.remove();
                            } catch (error) { 
                                console.error('Fehler beim Aktualisieren:', error); 
                                alert('Fehler: Status konnte nicht geändert werden.'); 
                                card.style.opacity = '1';
                            } 
                        }
                    });
                }
                ordersList.appendChild(card); 
            }); 
        }, (error) => { 
            console.error('Fehler beim Laden:', error); 
            document.getElementById('ordersList').innerHTML = `<div class="no-orders">Fehler: ${error.message}</div>`; 
        }); 
    }

    document.querySelectorAll('.filter-btn').forEach(btn => { 
        btn.addEventListener('click', function() { 
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); 
            this.classList.add('active'); 
            currentFilter = this.dataset.filter; 
            loadOrders(); 
        }); 
    });

    // --- Fehlende Artikel mit Lieferanten-Filter ---
    let usedItemsVisible = false;
    let currentSupplierFilter = 'all';
    let cachedMissingOrders = []; 
    let usedUnsub = null; 

    const toggleUsedBtn = document.getElementById('toggleUsedBtn');
    const usedItemsList = document.getElementById('usedItemsList');
    const usedItemsFilterContainer = document.getElementById('usedItemsFilterContainer');
    const supplierFilterSelect = document.getElementById('supplierFilter');
    const exportPdfBtn = document.getElementById('exportPdfBtn');

    function renderUsedItems(orders) { 
        const uniqueSuppliers = new Set();
        orders.forEach(order => {
            const supplier = getSupplierByArticleNumber(order.articleNumber);
            uniqueSuppliers.add(supplier);
        });

        const currentSelection = supplierFilterSelect.value;
        supplierFilterSelect.innerHTML = '<option value="all">Alle Lieferanten</option>';
        Array.from(uniqueSuppliers).sort().forEach(supplier => {
            const option = document.createElement('option');
            option.value = supplier;
            option.textContent = supplier;
            supplierFilterSelect.appendChild(option);
        });
        
        if (Array.from(uniqueSuppliers).includes(currentSelection)) {
            supplierFilterSelect.value = currentSelection;
        } else {
            supplierFilterSelect.value = 'all';
            currentSupplierFilter = 'all';
        }

        usedItemsList.innerHTML = ''; 
        const filteredOrders = currentSupplierFilter === 'all' 
            ? orders 
            : orders.filter(order => getSupplierByArticleNumber(order.articleNumber) === currentSupplierFilter);

        if (filteredOrders.length === 0) { 
            usedItemsList.innerHTML = '<div class="no-orders">Keine fehlenden Artikel für diesen Lieferanten</div>'; 
            return; 
        } 

        filteredOrders.forEach((order) => { 
            const supplier = getSupplierByArticleNumber(order.articleNumber);
            const card = document.createElement('div'); 
            card.className = 'order-card'; 
            card.style.borderLeftColor = '#f44336'; 
            card.dataset.orderId = order.id; 
            const deliveryDisplay = getRelativeDeliveryLabel(order.timestamp); 
            
            card.innerHTML = `
                <div class="order-header">
                    <div class="order-product">${order.productName}</div>
                    <div class="order-quantity">${order.quantity}&nbsp;${order.unit}</div>
                    <div class="order-status" style="background:#f44336;">Fehlend</div>
                </div>
                <div class="order-details">
                    Art-Nr: ${order.articleNumber} <br>
                    <strong>Lieferant:</strong> ${supplier} <br>
                    📅 ${deliveryDisplay}
                </div>`; 
            
            card.addEventListener('click', async () => { 
                try { 
                    await db.collection('orders').doc(order.id).update({ status: 'erledigt' }); 
                    card.remove(); 
                } catch (error) { 
                    console.error('Fehler beim Aktualisieren des Status:', error); 
                    alert('Fehler: Status konnte nicht geändert werden.'); 
                } 
            }); 
            usedItemsList.appendChild(card); 
        }); 
    }

    toggleUsedBtn.addEventListener('click', () => { 
        usedItemsVisible = !usedItemsVisible;
        usedItemsList.style.display = usedItemsVisible ? 'block' : 'none'; 
        usedItemsFilterContainer.style.display = usedItemsVisible ? 'flex' : 'none'; 
        toggleUsedBtn.textContent = usedItemsVisible ? '❌' : '🚫'; 
        
        if (usedItemsVisible) { 
            usedUnsub = db.collection('orders').where('status', '==', 'fehlend').onSnapshot((snapshot) => { 
                cachedMissingOrders = []; 
                snapshot.forEach(doc => { 
                    cachedMissingOrders.push({ id: doc.id, ...doc.data() }); 
                }); 
                cachedMissingOrders.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0)); 
                renderUsedItems(cachedMissingOrders); 
            }, (error) => { 
                console.error('Fehler beim Laden der fehlenden Artikel:', error); 
                usedItemsList.innerHTML = `<div class="no-orders">Fehler: ${error.message}</div>`; 
            }); 
        } else { 
            if (usedUnsub) { usedUnsub(); usedUnsub = null; } 
        } 
    });

    supplierFilterSelect.addEventListener('change', (e) => {
        currentSupplierFilter = e.target.value;
        renderUsedItems(cachedMissingOrders);
    });

    // --- PDF Export Logik (Robuster Direkt-Ansatz mit html2canvas + jsPDF.addImage) ---
    exportPdfBtn.addEventListener('click', async () => {
        if (cachedMissingOrders.length === 0) {
            alert('Keine fehlenden Artikel zum Exportieren vorhanden.');
            return;
        }

        let exportData = currentSupplierFilter === 'all' 
            ? [...cachedMissingOrders] 
            : cachedMissingOrders.filter(order => getSupplierByArticleNumber(order.articleNumber) === currentSupplierFilter);

        if (exportData.length === 0) {
            alert('Keine fehlenden Artikel für den gewählten Filter vorhanden.');
            return;
        }

        if (currentSupplierFilter === 'all') {
            exportData.sort((a, b) => {
                const supA = getSupplierByArticleNumber(a.articleNumber);
                const supB = getSupplierByArticleNumber(b.articleNumber);
                return supA.localeCompare(supB, 'de');
            });
        }

        exportPdfBtn.disabled = true;
        exportPdfBtn.textContent = '⏳ Wird erstellt...';

        // 1. HTML-Tabelle erstellen und ins DOM einfügen
        const tempDiv = document.createElement('div');
        tempDiv.id = 'pdf-export-temp';
        // WICHTIG: Element MUSS im sichtbaren Bereich sein, damit html2canvas es rendert.
        // Wir nutzen z-index: -1 und pointer-events: none, damit es für Nutzer unsichtbar ist.
        tempDiv.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 800px;
            background: white;
            z-index: -1;
            pointer-events: none;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            color: black;
        `;
        
        let tableHTML = `
            <h2 style="margin: 0 0 5px 0; font-size: 20px; color: #333;">
                ${currentSupplierFilter === 'all' ? 'Bestellliste: Alle Lieferanten' : `Bestellliste: ${currentSupplierFilter}`}
            </h2>
            <p style="margin: 0 0 20px 0; font-size: 12px; color: #666;">
                Erstellt am: ${new Date().toLocaleString('de-DE')}
            </p>
            <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                <thead>
                    <tr style="background-color: #667eea; color: white;">
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Lieferant</th>
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Art-Nr</th>
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Produktname</th>
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Menge</th>
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Datum</th>
                    </tr>
                </thead>
                <tbody>
        `;

        exportData.forEach(order => {
            const supplier = getSupplierByArticleNumber(order.articleNumber);
            const date = order.timestamp ? (order.timestamp.toDate ? order.timestamp.toDate().toLocaleDateString('de-DE') : 'Unbekannt') : 'Unbekannt';
            tableHTML += `
                <tr>
                    <td style="padding: 8px; border: 1px solid #ddd; font-weight: 600;">${supplier}</td>
                    <td style="padding: 8px; border: 1px solid #ddd;">${order.articleNumber}</td>
                    <td style="padding: 8px; border: 1px solid #ddd;">${order.productName}</td>
                    <td style="padding: 8px; border: 1px solid #ddd;">${order.quantity} ${order.unit}</td>
                    <td style="padding: 8px; border: 1px solid #ddd;">${date}</td>
                </tr>
            `;
        });

        tableHTML += `</tbody></table>`;
        tempDiv.innerHTML = tableHTML;
        document.body.appendChild(tempDiv);

        try {
            // 2. html2canvas DIREKT aufrufen (nicht über doc.html)
            // Kleine Verzögerung, damit der Browser Zeit hat, das Element zu rendern
            await new Promise(resolve => setTimeout(resolve, 100));
            
            const canvas = await html2canvas(tempDiv, {
                scale: 2, // Höhere Qualität
                backgroundColor: '#ffffff',
                useCORS: true,
                logging: false
            });

            // 3. Canvas in jsPDF einfügen
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            
            const pageWidth = 210;  // A4 Breite in mm
            const pageHeight = 297; // A4 Höhe in mm
            const margin = 10;
            const usableWidth = pageWidth - (2 * margin);
            const usableHeight = pageHeight - (2 * margin);
            
            // Bild-Dimensionen berechnen
            const imgWidth = usableWidth;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            
            // Wenn das Bild auf eine Seite passt
            if (imgHeight <= usableHeight) {
                doc.addImage(canvas.toDataURL('image/png'), 'PNG', margin, margin, imgWidth, imgHeight);
            } else {
                // Mehrseitiges PDF: Canvas in Slices schneiden
                const canvasWidthPx = canvas.width;
                const canvasHeightPx = canvas.height;
                const sliceHeightPx = (usableHeight / imgWidth) * canvasWidthPx;
                
                let position = 0;
                let pageNumber = 0;
                
                while (position < canvasHeightPx) {
                    if (pageNumber > 0) doc.addPage();
                    
                    // Temporäres Canvas für den aktuellen Ausschnitt
                    const sliceCanvas = document.createElement('canvas');
                    sliceCanvas.width = canvasWidthPx;
                    sliceCanvas.height = Math.min(sliceHeightPx, canvasHeightPx - position);
                    const ctx = sliceCanvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
                    ctx.drawImage(
                        canvas, 
                        0, position, canvasWidthPx, sliceCanvas.height,
                        0, 0, canvasWidthPx, sliceCanvas.height
                    );
                    
                    const sliceImgHeight = (sliceCanvas.height * imgWidth) / canvasWidthPx;
                    doc.addImage(sliceCanvas.toDataURL('image/png'), 'PNG', margin, margin, imgWidth, sliceImgHeight);
                    
                    position += sliceHeightPx;
                    pageNumber++;
                }
            }

            // 4. PDF speichern
            const dateStr = new Date().toLocaleDateString('de-DE').replace(/\./g, '-');
            const fileName = currentSupplierFilter === 'all' 
                ? `Bestellliste_Alle_${dateStr}.pdf` 
                : `Bestellliste_${currentSupplierFilter.replace(/[^a-zA-Z0-9äöüÄÖÜß]/g, '_')}_${dateStr}.pdf`;
            
            doc.save(fileName);

        } catch (error) {
            console.error('Fehler beim PDF-Export:', error);
            alert('Fehler beim Erstellen der PDF: ' + error.message);
        } finally {
            // 5. Aufräumen
            if (document.body.contains(tempDiv)) {
                document.body.removeChild(tempDiv);
            }
            exportPdfBtn.disabled = false;
            exportPdfBtn.textContent = '📄 PDF exportieren';
        }
    });
    // -------------------------------------------------------------

    document.getElementById('ordersList').addEventListener('click', async (e) => { 
        const orderId = e.target.closest('[data-id]')?.dataset.id; 
        if (!orderId) return; 
        if (e.target.classList.contains('toggle-comment')) { 
            const editor = document.querySelector(`.comment-editor[data-id="${orderId}"]`); 
            editor.style.display = editor.style.display === 'block' ? 'none' : 'block'; 
            return; 
        } 
        if (e.target.classList.contains('save-comment')) { 
            const textarea = document.querySelector(`.comment-input[data-id="${orderId}"]`); 
            const comment = textarea.value.trim(); 
            try { 
                await db.collection('orders').doc(orderId).update({ comment: comment || firebase.firestore.FieldValue.delete() }); 
                document.querySelector(`.comment-editor[data-id="${orderId}"]`).style.display = 'none'; 
            } catch (err) { 
                console.error('Fehler beim Speichern:', err); 
                alert('Fehler: ' + (err.message || 'Speichern fehlgeschlagen.')); 
            } 
            return; 
        } 
        if (e.target.classList.contains('cancel-comment')) { 
            document.querySelector(`.comment-editor[data-id="${orderId}"]`).style.display = 'none'; 
        } 
    });

    loadOrders();
  </script>
</body>
</html>
